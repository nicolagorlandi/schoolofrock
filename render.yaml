services:
  - type: web
    name: panet1-web
    env: python
    plan: free
    buildCommand: |
      apt-get update
      apt-get install -y libjpeg-dev zlib1g-dev libfreetype6-dev wkhtmltopdf
      pip install --upgrade pip
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: gunicorn PaNet1Project.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: RENDER
        value: true
      - key: WKHTMLTOPDF_CMD
        value: /usr/bin/wkhtmltopdf
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_YW1hCngzG5ia@ep-summer-surf-baqea4i7-pooler.c-8.eu-central-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require

        
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_PASSWORD
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: gorlandinicola@gmail.com

