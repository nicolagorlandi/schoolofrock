services:
  - type: web
    name: panet1-web
    env: python
    plan: free
    buildCommand: |
      apt-get update
      apt-get install -y libjpeg-dev zlib1g-dev libfreetype6-dev
      pip install --upgrade pip
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: gunicorn PaNet1Project.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.10

databases:
  - name: panet1-db
    plan: free

